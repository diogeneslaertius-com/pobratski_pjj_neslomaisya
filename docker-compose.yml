name: best-solution-kz-16

services:
  api:
    build: .
    image: kz-address-parser
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ui:
    image: kz-address-parser
    command: ["streamlit", "run", "ui.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      OCR_DEMO_MODE: "1"
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - api
